name: Deploy & Migrate to Production

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Project & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Configuration Check
        run: |
          python manage.py check

      - name: Verify No Missing Migrations
        run: |
          python manage.py makemigrations --check --dry-run

  deploy:
    name: Deploy to Production VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote Deployment over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "=== [1/15] VERIFYING PROJECT DIRECTORY ==="
            APP_DIR="/var/www/invoice-maker"
            if [ ! -d "$APP_DIR" ]; then
              echo "[ERROR] Application directory $APP_DIR does not exist!" >&2
              exit 1
            fi
            cd "$APP_DIR"

            echo "=== [2/15] VERIFYING GIT REPOSITORY ==="
            if [ ! -d ".git" ]; then
              echo "[ERROR] Directory $APP_DIR is not a git repository!" >&2
              exit 1
            fi

            echo "=== [3/15] RUNNING PRE-MIGRATION DATABASE BACKUP ==="
            if [ -f "scripts/backup_db.sh" ]; then
              chmod +x scripts/backup_db.sh
              ./scripts/backup_db.sh
            else
              echo "[NOTICE] scripts/backup_db.sh will be loaded upon pull."
            fi

            echo "=== [4/15] FETCHING LATEST COMMITS ==="
            git fetch origin main

            echo "=== [5/15] CHECKING OUT MAIN BRANCH ==="
            git checkout main

            echo "=== [6/15] PULLING CODE (--ff-only) ==="
            git pull --ff-only origin main

            echo "=== [7/15] ENSURING BACKUP SCRIPT EXECUTED ==="
            chmod +x scripts/backup_db.sh
            if [ ! -d "/var/backups/invoice-maker" ] || [ -z "$(ls -A /var/backups/invoice-maker/*.sql 2>/dev/null || true)" ]; then
              ./scripts/backup_db.sh
            fi

            echo "=== [8/15] ACTIVATING VIRTUAL ENVIRONMENT ==="
            if [ ! -d "venv" ]; then
              echo "[ERROR] Virtual environment 'venv' not found in $APP_DIR!" >&2
              exit 1
            fi
            source venv/bin/activate

            echo "=== [9/15] PYTHON ENVIRONMENT & DEPENDENCIES ==="
            python --version
            pip install -r requirements.txt --quiet
            python manage.py check

            echo "=== [10/15] REVIEWING MIGRATION STATUS & PLAN ==="
            python manage.py showmigrations
            python manage.py migrate --plan

            echo "=== [11/15] EXECUTING DJANGO MIGRATIONS ==="
            python manage.py migrate --noinput

            echo "=== [12/15] COLLECTING STATIC ASSETS ==="
            python manage.py collectstatic --noinput

            echo "=== [13/15] RESTARTING GUNICORN SERVICE ==="
            sudo systemctl restart invoice-maker.service

            echo "=== [14/15] VERIFYING SERVICE STATUS ==="
            sudo systemctl is-active invoice-maker.service

            echo "=== [15/15] APPLICATION HEALTH CHECK ==="
            sleep 3
            curl -fsS -L -o /dev/null -w "Health Check OK (HTTP %{http_code})\n" https://invoice.fundtld.info/accounts/login/

            echo "=========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="
