name: Deploy & Migrate to Production

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Project & Migrations
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: django.db.backends.sqlite3
      SECRET_KEY: ci-test-key-for-github-runner-checks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Configuration Check
        run: |
          python manage.py check

      - name: Verify No Missing Migrations
        run: |
          python manage.py makemigrations --check --dry-run

  deploy:
    name: Deploy to Production VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote Deployment over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            bash -s << 'EOF'
            set -euo pipefail

            echo "=== [1/14] VERIFYING PROJECT DIRECTORY ==="
            APP_DIR="/var/www/invoice-maker"
            if [ ! -d "$APP_DIR" ]; then
              echo "[ERROR] Application directory $APP_DIR does not exist!" >&2
              exit 1
            fi
            cd "$APP_DIR"

            echo "=== [2/14] VERIFYING GIT REPOSITORY ==="
            if [ ! -d ".git" ]; then
              echo "[ERROR] Directory $APP_DIR is not a git repository!" >&2
              exit 1
            fi

            echo "=== [3/14] FETCHING LATEST COMMITS ==="
            git fetch origin main

            echo "=== [4/14] CHECKING OUT MAIN BRANCH ==="
            git checkout main

            echo "=== [5/14] PULLING CODE (--ff-only) ==="
            git pull --ff-only origin main

            echo "=== [6/14] RUNNING PRE-MIGRATION DATABASE BACKUP ==="
            chmod +x scripts/backup_db.sh
            ./scripts/backup_db.sh </dev/null

            echo "=== [7/14] ACTIVATING VIRTUAL ENVIRONMENT ==="
            if [ ! -d "venv" ]; then
              echo "[ERROR] Virtual environment 'venv' not found in $APP_DIR!" >&2
              exit 1
            fi
            source venv/bin/activate

            echo "=== [8/14] PYTHON ENVIRONMENT & DEPENDENCIES ==="
            python --version
            pip install -r requirements.txt --quiet
            python manage.py check

            echo "=== [9/14] REVIEWING MIGRATION STATUS & PLAN ==="
            python manage.py showmigrations
            python manage.py migrate --plan

            echo "=== [10/14] EXECUTING DJANGO MIGRATIONS ==="
            python manage.py migrate --noinput

            echo "=== [11/14] COLLECTING STATIC ASSETS ==="
            python manage.py collectstatic --noinput

            echo "=== [12/14] RESTARTING GUNICORN SERVICE ==="
            sudo systemctl restart invoice-maker.service

            echo "=== [13/14] VERIFYING SERVICE STATUS ==="
            sudo systemctl is-active invoice-maker.service

            echo "=== [14/14] APPLICATION HEALTH CHECK ==="
            sleep 3
            curl -fsS -L --resolve invoice.fundtld.info:443:127.0.0.1 -o /dev/null -w "Health Check OK (HTTP %{http_code})\n" https://invoice.fundtld.info/accounts/login/

            echo "=========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="
            EOF
