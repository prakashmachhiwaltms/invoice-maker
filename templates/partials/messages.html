{% if messages %}
<div class="toast-stack">
    {% for message in messages %}
    <div class="toast align-items-center border-0 shadow-sm
        {% if message.tags == 'success' %}text-bg-success
        {% elif message.tags == 'error' %}text-bg-danger
        {% elif message.tags == 'warning' %}text-bg-warning
        {% else %}text-bg-primary{% endif %}"
        role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-2"></i>
                {% elif message.tags == 'error' %}<i class="bi bi-x-circle-fill me-2"></i>
                {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-triangle-fill me-2"></i>
                {% else %}<i class="bi bi-info-circle-fill me-2"></i>{% endif %}
                {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
